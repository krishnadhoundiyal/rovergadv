# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

language: en-US
tone_instructions: "Be concise. Prioritize fidelity to the frozen GADV demo requirements, browser behavior, safety of camera handling, deterministic simulation, and regression risk over style-only comments."

chat:
  auto_reply: true

reviews:
  profile: chill
  high_level_summary: true
  review_status: true
  review_details: true
  collapse_walkthrough: false
  changed_files_summary: true
  sequence_diagrams: true
  assess_linked_issues: true
  related_issues: true
  related_prs: true
  poem: false
  enable_prompt_for_ai_agents: true

  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: true
    ignore_title_keywords:
      - "WIP"

  path_instructions:
    - path: "src/**/*.{ts,tsx,js,jsx}"
      instructions: |
        Functionality and fidelity to the repository README and supplied design documents are the first priority.
        Preserve the frozen mission-control experience and do not invent hardware capabilities or external services.
        The iPad camera is the only live input; all telemetry, navigation, motion, distance, elevation, contour, and rover behavior remain local simulation.
        Flag any network, microphone, geolocation, Bluetooth, recording, upload, analytics, remote-control, or physical-driving behavior unless the authoritative project documents explicitly add it.
        Review interruption, cleanup, stale async work, pointer ownership, deterministic reset, and Safari/iPad lifecycle behavior carefully.

    - path: "src/camera.ts"
      instructions: |
        Verify video-only acquisition, permission and error handling, stale-request cancellation, track cleanup, backgrounding behavior, front/rear fallback, and that no media is recorded, uploaded, or retained.

    - path: "src/simulation.ts"
      instructions: |
        Verify deterministic local simulation, bounded values, reset behavior, persistent virtual navigation semantics, and that simulated data is never presented as a physical sensor measurement.

    - path: "src/Joystick.tsx"
      instructions: |
        Verify independent pointer ownership, pointer capture, deadzone and saturation behavior, interruption handling, release semantics, HOLD behavior, keyboard accessibility, and simultaneous translation and yaw control.

    - path: "**/*.{test,spec}.{ts,tsx,js,jsx}"
      instructions: |
        Require behavior coverage for camera success and denial paths, stale or interrupted media flows, simulation reset, joystick interruption, responsive landscape behavior, and Chromium plus WebKit differences where relevant.
        Tests must not require physical rover hardware or a physical camera.

    - path: ".github/workflows/**"
      instructions: |
        Verify Node 22 usage, lint, typecheck, unit tests, production build, Chromium and WebKit end-to-end coverage, correct GitHub Pages base path, and that deployment only publishes the intended static dist output.
