name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Stage project path under custom domain
        run: |
          mkdir -p pages-site/rovergadv
          cp -R dist/. pages-site/rovergadv/
          printf '%s\n' '<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="refresh" content="0; url=/rovergadv/"><title>GADV D4-S</title></head><body><a href="/rovergadv/">Open GADV D4-S Mission Control</a></body></html>' > pages-site/index.html
          test -f pages-site/rovergadv/index.html
          test -f pages-site/rovergadv/favicon.svg
          test -d pages-site/rovergadv/assets
          grep -q '/rovergadv/' pages-site/rovergadv/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages-site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
